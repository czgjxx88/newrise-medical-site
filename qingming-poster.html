<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 800px;
    height: 1100px;
    background: linear-gradient(160deg, #e8f5e9 0%, #c8e6c9 30%, #a5d6a7 60%, #81c784 100%);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .bg-circle1 {
    position: absolute; top: -120px; right: -120px;
    width: 450px; height: 450px;
    background: radial-gradient(circle, rgba(255,255,255,0.35) 0%, transparent 70%);
    border-radius: 50%;
  }
  .bg-circle2 {
    position: absolute; bottom: -100px; left: -100px;
    width: 380px; height: 380px;
    background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, transparent 70%);
    border-radius: 50%;
  }
  .willow {
    position: absolute; top: 0; left: 0; right: 0; height: 130px;
    display: flex; justify-content: space-around; padding: 0 30px;
  }
  .willow-leaf {
    width: 3px; border-radius: 2px;
    background: linear-gradient(180deg, #4caf50, transparent);
    transform-origin: top center; opacity: 0.45;
  }
  .willow-leaf:nth-child(3n) { height: 100px; transform: rotate(-4deg); }
  .willow-leaf:nth-child(3n+1) { height: 70px; transform: rotate(3deg); }
  .willow-leaf:nth-child(3n+2) { height: 120px; transform: rotate(-2deg); }

  .container { position: relative; z-index: 1; text-align: center; padding: 30px 40px; }

  .subtitle-top {
    font-size: 22px; color: #558b2f; letter-spacing: 14px;
    margin-bottom: 18px; font-weight: 300;
  }
  .main-title {
    font-size: 92px; color: #2e7d32; font-weight: 700;
    letter-spacing: 18px;
    text-shadow: 3px 3px 10px rgba(46,125,50,0.12);
    margin-bottom: 12px;
  }
  .english {
    font-size: 17px; color: #689f38; letter-spacing: 8px;
    text-transform: uppercase; margin-bottom: 48px; font-weight: 300;
  }
  .divider {
    width: 140px; height: 2px;
    background: linear-gradient(90deg, transparent, #558b2f, transparent);
    margin: 0 auto 48px;
  }
  .date-label {
    font-size: 18px; color: #689f38; letter-spacing: 6px; margin-bottom: 14px;
  }
  .date-main {
    font-size: 44px; color: #2e7d32; font-weight: 600; letter-spacing: 4px;
  }
  .date-sub {
    font-size: 20px; color: #558b2f; margin-top: 10px; font-weight: 300; letter-spacing: 2px;
  }

  .tips-box {
    background: rgba(255,255,255,0.38);
    border-radius: 18px; padding: 26px 42px;
    margin-top: 44px;
    border: 1px solid rgba(255,255,255,0.55);
  }
  .tips-title {
    font-size: 19px; color: #2e7d32; margin-bottom: 14px; letter-spacing: 5px;
  }
  .tip-item {
    font-size: 17px; color: #388e3c; line-height: 2.1;
    letter-spacing: 2px; text-align: left;
  }
  .tip-item::before { content: "🌿 "; }

  .footer {
    position: absolute; bottom: 38px;
    font-size: 14px; color: #81c784; letter-spacing: 5px;
  }
  .flower { position: absolute; font-size: 30px; opacity: 0.55; }
  .fl1 { top: 50px; left: 50px; }
  .fl2 { top: 110px; right: 70px; }
  .fl3 { bottom: 90px; left: 60px; }
  .fl4 { bottom: 130px; right: 50px; }
</style>
</head>
<body>
  <div class="bg-circle1"></div>
  <div class="bg-circle2"></div>
  <div class="willow">
    <div class="willow-leaf"></div><div class="willow-leaf"></div><div class="willow-leaf"></div>
    <div class="willow-leaf"></div><div class="willow-leaf"></div><div class="willow-leaf"></div>
    <div class="willow-leaf"></div><div class="willow-leaf"></div><div class="willow-leaf"></div>
    <div class="willow-leaf"></div><div class="willow-leaf"></div><div class="willow-leaf"></div>
  </div>
  <div class="flower fl1">🌸</div>
  <div class="flower fl2">🌼</div>
  <div class="flower fl3">🌺</div>
  <div class="flower fl4">🌷</div>

  <div class="container">
    <div class="subtitle-top">春暖花开 踏青时节</div>
    <div class="main-title">清明假期</div>
    <div class="english">Qingming Festival Holiday</div>
    <div class="divider"></div>
    <div class="date-label">放 假 时 间</div>
    <div class="date-main">4月4日 — 4月6日</div>
    <div class="date-sub">共三天 · 周六至周一</div>

    <div class="tips-box">
      <div class="tips-title">温 馨 提 示</div>
      <div class="tip-item">祭扫出行，注意安全</div>
      <div class="tip-item">错峰踏青，文明出游</div>
      <div class="tip-item">提前安排工作，假期安心休息</div>
    </div>
  </div>

  <div class="footer">— 清明时节 · 万物清明 —</div>
</body>
</html>
